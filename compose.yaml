services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: atlas_ops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_ops"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://atlas:${POSTGRES_PASSWORD}@db:5432/atlas_ops
      FRONTEND_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  postgres_data:
