name: Deploy Atlas Ops frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Angular dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build Angular for GitHub Pages
        working-directory: frontend
        run: npx ng build --configuration production --base-href "/atlas-ops-2./"

      - name: Prepare single-page app fallback
        run: |
          cp frontend/dist/atlas-ops/browser/index.html frontend/dist/atlas-ops/browser/404.html
          touch frontend/dist/atlas-ops/browser/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/atlas-ops/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
